name: CI

on:
  push:
    branches: [main, developer, "feature/**"]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening); the comment shows the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore OpsFlow.slnx

      - name: Check formatting and code style
        run: dotnet format OpsFlow.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build OpsFlow.slnx --configuration Release --no-restore

      - name: Check migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project src/OpsFlow.Api --configuration Release --no-build

      # Integration tests start SQL Server 2022 through Testcontainers, using the runner's Docker.
      - name: Test
        run: >
          dotnet test OpsFlow.slnx --configuration Release --no-build
          --logger "trx" --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 14

      - name: Build migration bundle
        run: >
          dotnet ef migrations bundle --project src/OpsFlow.Api --configuration Release
          --self-contained --target-runtime linux-x64 --output artifacts/efbundle

      - name: Upload migration bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efbundle-linux-x64
          path: artifacts/efbundle
          retention-days: 30

  docker:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the production image to prove the Dockerfile works; publishing is a deployment concern.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: opsflow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
